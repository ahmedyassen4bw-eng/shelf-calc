<script>
/* ===================== الإعدادات ===================== */
const CONFIG = {

};
const SEED = /*SEED*/null;
const DEMO = !CONFIG.SUPABASE_URL || CONFIG.SUPABASE_URL.startsWith('/*');

const CATS = [{k:'yog',n:'الزبادى'},{k:'drk',n:'المشروبات'},{k:'pud',n:'البودينج'},{k:'milk',n:'اللبن'}];
const GOVS = {Cairo:'القاهرة',Giza:'الجيزة',Alex:'الإسكندرية'};
const ROLES = {sup:'مسؤول فروع',gov:'مسؤول عام',analyst:'داتا أناليست',admin:'مدير'};
const ERRS = {
  bad_pin:'الرمز السري غير صحيح', locked:'تم إيقاف الدخول 15 دقيقة بسبب محاولات خاطئة كثيرة',
  locked_reading:'القراءة دي اتقفلت. التعديل بقى متاح لمديرك فقط', forbidden:'مش مسموح لك بالعملية دي',
  actual_gt_total:'المساحة الفعلية لا يمكن أن تكون أكبر من الكلية', invalid:'البيانات غير مكتملة أو غير صحيحة',
  no_branch:'الفرع غير موجود', bad_new_pin:'الرمز لازم يكون من 4 لـ 8 أرقام', network:'مفيش اتصال بالإنترنت'
};

/* ===================== أدوات ===================== */
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const cairoDate = ts => new Date(ts).toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'});
const isToday = ts => ts && cairoDate(ts) === cairoDate(Date.now());
const fmtDate = ts => { const d = cairoDate(ts).split('-'); return `${d[2]}/${d[1]}/${d[0]}`; };
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const fmtN = n => (Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const fmtP = p => p == null ? '—' : (p*100).toFixed(2) + '%';
function mkErr(code){ const e = new Error(ERRS[code] || code); e.code = code; return e; }
function catPct(c){ if(!c || c.na) return null; return c.t > 0 ? c.a / c.t : null; }
function totalPct(cats){
  let t = 0, a = 0, any = false;
  CATS.forEach(({k}) => { const c = cats && cats[k]; if(c && !c.na){ t += +c.t; a += +c.a; any = true; } });
  return any && t > 0 ? a / t : null;
}
function checkCats(cats){
  let n = 0;
  for(const [k,v] of Object.entries(cats || {})){
    if(!CATS.some(c => c.k === k)) throw mkErr('invalid');
    if(v.na){ n++; continue; }
    const t = num(v.t), a = num(v.a);
    if(t == null || a == null || t <= 0 || a < 0) throw mkErr('invalid');
    if(a > t) throw mkErr('actual_gt_total');
    n++;
  }
  return n === 4;
}

/* ===================== قاعدة البيانات: Supabase ===================== */
// المفاتيح الجديدة (sb_publishable_...) بتتبعت في apikey بس؛ القديمة (anon JWT) في الاتنين
function authHeaders(ct){
  const h = {'apikey':CONFIG.SUPABASE_KEY,'Content-Type':ct};
  if(!CONFIG.SUPABASE_KEY.startsWith('sb_')) h['Authorization'] = 'Bearer ' + CONFIG.SUPABASE_KEY;
  return h;
}
class RemoteBackend {
  async rpc(fn, args){
    let res;
    try{
      res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${fn}`, {
        method:'POST',
        headers:authHeaders('application/json'),
        body: JSON.stringify(args || {})
      });
    }catch(e){ throw mkErr('network'); }
    const body = await res.json().catch(() => null);
    if(!res.ok){ throw mkErr(body && body.message || 'خطأ في الخادم'); }
    if(body && body.error) throw mkErr(body.error);
    return body;
  }
  listUsers(){ return this.rpc('list_users'); }
  login(u,p){ return this.rpc('login',{p_user:u,p_pin:p}); }
  getData(u,p){ return this.rpc('get_data',{p_user:u,p_pin:p}); }
  saveReading(u,p,branch,cats,round){ return this.rpc('save_reading',{p_user:u,p_pin:p,p_branch:branch,p_cats:cats,p_round:round ?? null}); }
  deleteReading(u,p,id){ return this.rpc('admin_delete_reading',{p_user:u,p_pin:p,p_id:id}); }
  saveBranch(u,p,b){ return this.rpc('admin_save_branch',{p_user:u,p_pin:p,p_id:b.id ?? null,p_gov:b.gov,p_name:b.name,p_sup:b.sup_id,p_active:b.active}); }
  saveUser(u,p,x){ return this.rpc('admin_save_user',{p_user:u,p_pin:p,p_id:x.id,p_name:x.name,p_role:x.role,p_gov:x.gov || null,p_active:x.active,p_new_pin:x.pin || null}); }
  async uploadPhoto(dataUrl, path){
    const blob = await (await fetch(dataUrl)).blob();
    let res;
    try{
      res = await fetch(`${CONFIG.SUPABASE_URL}/storage/v1/object/shelves/${path}`, {
        method:'POST', headers:authHeaders('image/jpeg'), body: blob });
    }catch(e){ throw mkErr('network'); }
    if(!res.ok) throw mkErr('تعذر رفع الصورة');
    return path;
  }
  photoUrl(ref){ return ref && ref.startsWith('data:') ? ref : `${CONFIG.SUPABASE_URL}/storage/v1/object/public/shelves/${ref}`; }
}

/* ===================== وضع التجربة (على الجهاز فقط) ===================== */
class LocalBackend {
  constructor(){
    this.db = store.get('demo-db');
    if(!this.db){
      this.db = { users: SEED.users.map(u => ({...u, pin:'1234', active:true})), branches: clone(SEED.branches), readings: [], seq: 1, fails:{} };
      this.persist();
    }
  }
  persist(){ store.set('demo-db', this.db); }
  auth(id, pin){
    const u = this.db.users.find(x => x.id === id && x.active !== false);
    if(!u || u.pin !== pin) throw mkErr('bad_pin');
    return u;
  }
  pub(u){ return {id:u.id,name:u.name,role:u.role,gov:u.gov}; }
  supRound(sid){
    const mine = this.db.branches.filter(b => b.sup_id === sid);
    const ids = new Set(mine.map(b => b.id));
    const rs = this.db.readings.filter(r => ids.has(r.branch_id));
    const r = rs.reduce((m,x) => Math.max(m, x.round), 0);
    if(r === 0) return 1;
    const open = mine.some(b => b.active && !rs.some(x => x.branch_id === b.id && x.round === r && x.complete));
    return open ? r : r + 1;
  }
  async listUsers(){ return this.db.users.filter(u => u.active !== false).map(u => this.pub(u)); }
  async login(id,pin){ return this.pub(this.auth(id,pin)); }
  async getData(id,pin){
    const u = this.auth(id,pin);
    if(u.role === 'sup'){
      const r = this.supRound(u.id);
      const br = this.db.branches.filter(b => b.sup_id === u.id && b.active);
      const ids = new Set(br.map(b => b.id));
      const rd = this.db.readings.filter(x => ids.has(x.branch_id) && (x.round === r || (x.created_by === u.id && isToday(x.created_at))));
      return clone({user:this.pub(u), round:r, branches:br, readings:rd, users:[]});
    }
    const all = u.role === 'admin' || u.role === 'analyst';
    const br = this.db.branches.filter(b => all || b.gov === u.gov);
    const ids = new Set(br.map(b => b.id));
    return clone({user:this.pub(u), round:null, branches:br, readings:this.db.readings.filter(x => ids.has(x.branch_id)),
      users:this.db.users.map(x => ({id:x.id,name:x.name,role:x.role,gov:x.gov,active:x.active !== false}))});
  }
  async saveReading(id,pin,branchId,cats,round){
    const u = this.auth(id,pin);
    const b = this.db.branches.find(x => x.id === branchId);
    if(!b) throw mkErr('no_branch');
    const done = checkCats(cats);
    let r;
    if(u.role === 'sup'){
      if(b.sup_id !== u.id || !b.active) throw mkErr('forbidden');
      r = this.supRound(u.id);
      if(round != null && round !== r){
        const ex = this.db.readings.find(x => x.branch_id === branchId && x.round === round);
        if(!ex || ex.created_by !== u.id || !isToday(ex.created_at)) throw mkErr('locked_reading');
        r = round;
      }
      const ex = this.db.readings.find(x => x.branch_id === branchId && x.round === r);
      if(ex && ex.complete && !(ex.created_by === u.id && isToday(ex.created_at))) throw mkErr('locked_reading');
    } else {
      if(u.role === 'gov' && b.gov !== u.gov) throw mkErr('forbidden');
      if(round == null) throw mkErr('invalid');
      r = round;
    }
    const now = new Date().toISOString();
    let ex = this.db.readings.find(x => x.branch_id === branchId && x.round === r);
    if(ex){ Object.assign(ex, {cats:clone(cats), complete:done, updated_at:now, updated_by:u.id}); }
    else { ex = {id:this.db.seq++, branch_id:branchId, round:r, sup_id:b.sup_id, cats:clone(cats), complete:done, created_at:now, updated_at:now, created_by:u.id, updated_by:u.id}; this.db.readings.push(ex); }
    this.persist();
    return clone({reading:ex, round: u.role === 'sup' ? this.supRound(u.id) : null});
  }
  async deleteReading(id,pin,rid){ const u = this.auth(id,pin); if(u.role !== 'admin') throw mkErr('forbidden'); this.db.readings = this.db.readings.filter(x => x.id !== rid); this.persist(); return {ok:true}; }
  async saveBranch(id,pin,b){
    const u = this.auth(id,pin); if(u.role !== 'admin') throw mkErr('forbidden');
    if(!String(b.name||'').trim()) throw mkErr('invalid');
    let x;
    if(b.id == null){ x = {id: Math.max(0,...this.db.branches.map(y=>y.id))+1, gov:b.gov, name:b.name.trim(), sup_id:b.sup_id, active:b.active !== false, sort: this.db.branches.length+1}; this.db.branches.push(x); }
    else { x = this.db.branches.find(y => y.id === b.id); Object.assign(x, {gov:b.gov, name:b.name.trim(), sup_id:b.sup_id, active:b.active !== false}); }
    this.persist(); return clone(x);
  }
  async saveUser(id,pin,x){
    const u = this.auth(id,pin); if(u.role !== 'admin') throw mkErr('forbidden');
    if(x.pin && !/^[0-9]{4,8}$/.test(x.pin)) throw mkErr('bad_new_pin');
    let t = this.db.users.find(y => y.id === x.id);
    if(t){ Object.assign(t, {name:(x.name||'').trim()||t.name, role:x.role, gov:x.gov||null, active:x.active !== false}); if(x.pin) t.pin = x.pin; }
    else { if(!x.pin) throw mkErr('bad_new_pin'); this.db.users.push({id:x.id,name:x.name.trim(),role:x.role,gov:x.gov||null,active:x.active !== false,pin:x.pin}); }
    this.persist(); return {ok:true};
  }
  async uploadPhoto(dataUrl){ return dataUrl; }
  photoUrl(ref){ return ref; }
}

const API = DEMO ? new LocalBackend() : new RemoteBackend();

/* ===================== الحالة ===================== */
const S = {
  sess: store.get('sess'),        // {id, pin}
  user: null, data: null, users: store.get('users-cache') || [],
  login: {gov:'', uid:'', pin:'', err:''},
  filter: 'all',                   // all | done | left
  q: '', sel: null, editRound: null, draft: null,
  tab: 'dash', f: {gov:'all', sup:'all'},
  armed: null, online: navigator.onLine, busy: false, waLink: null
};
const qKey = () => 'queue:' + S.user.id;
const dKey = () => 'draft:' + S.user.id;
const isMgr = () => S.user && S.user.role !== 'sup';
const canEdit = () => S.user && ['gov','analyst','admin'].includes(S.user.role);
const isAdmin = () => S.user && S.user.role === 'admin';

function toast(msg, ms=2600){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, ms); }

/* ---------- القراءات ---------- */
const readingsOf = bid => S.data.readings.filter(r => r.branch_id === bid).sort((a,b) => a.round - b.round);
const readingAt = (bid, round) => S.data.readings.find(r => r.branch_id === bid && r.round === round);
const branchById = id => S.data.branches.find(b => b.id === id);
const userName = id => (S.data.users.find(u => u.id === id) || S.users.find(u => u.id === id) || {}).name || (S.user && S.user.id === id ? S.user.name : '—');

function roundFor(supId){
  const mine = S.data.branches.filter(b => b.sup_id === supId);
  const ids = new Set(mine.map(b => b.id));
  const rs = S.data.readings.filter(r => ids.has(r.branch_id));
  let r = rs.reduce((m,x) => Math.max(m, x.round), 0);
  if(S.user.role === 'sup') r = Math.max(r, S.data.round || 1);
  if(r === 0) return 1;
  const open = mine.some(b => b.active && !rs.some(x => x.branch_id === b.id && x.round === r && x.complete));
  return open ? r : r + 1;
}
function branchStatus(b){
  const rd = readingAt(b.id, roundFor(b.sup_id));
  if(!rd) return 'none';
  if(rd.pending) return 'pend';
  return rd.complete ? 'done' : 'partial';
}
function editable(b, round){
  if(canEdit()) return true;
  const R = roundFor(b.sup_id), rd = readingAt(b.id, round);
  if(round === R) return !rd || !rd.complete || (rd.created_by === S.user.id && isToday(rd.created_at));
  return !!rd && rd.created_by === S.user.id && isToday(rd.created_at);
}

/* ---------- الطابور (حفظ بدون إنترنت) ---------- */
function queue(){ return store.get(qKey()) || []; }
function setQueue(q){ store.set(qKey(), q); }
function applyLocal(bid, round, cats, extra){
  let rd = readingAt(bid, round);
  const now = new Date().toISOString();
  const done = (() => { try{ return checkCats(cats); }catch(e){ return false; } })();
  if(rd) Object.assign(rd, {cats:clone(cats), complete:done, updated_at:now, ...extra});
  else { rd = {id:'local-'+Date.now(), branch_id:bid, round, sup_id:branchById(bid).sup_id, cats:clone(cats), complete:done, created_at:now, updated_at:now, created_by:S.user.id, updated_by:S.user.id, ...extra}; S.data.readings.push(rd); }
  cacheData();
}
function mergeServerReading(rd){
  S.data.readings = S.data.readings.filter(x => !(x.branch_id === rd.branch_id && x.round === rd.round));
  S.data.readings.push(rd);
}
function cacheData(){ if(S.user) store.set('data:' + S.user.id, S.data); }

async function pushOne(item){
  const cats = clone(item.cats);
  for(const c of CATS){
    const v = cats[c.k];
    if(v && v.photoData){
      const path = `${new Date().toISOString().slice(0,7)}/${item.branch}-r${item.round}-${c.k}-${Date.now()}.jpg`;
      v.photo = await API.uploadPhoto(v.photoData, path);
      delete v.photoData;
    }
  }
  const res = await API.saveReading(S.sess.id, S.sess.pin, item.branch, cats, item.round);
  mergeServerReading(res.reading);
  if(res.round != null) S.data.round = res.round;
  cacheData();
  return res;
}
async function syncQueue(){
  if(!S.user) return;
  let q = queue(); if(!q.length) return;
  while(q.length){
    try{ await pushOne(q[0]); q.shift(); setQueue(q); }
    catch(e){
      if(e.code === 'network') break;
      toast('لم يتم رفع قراءة محفوظة على الجهاز: ' + e.message, 5000);
      q.shift(); setQueue(q);
    }
  }
  if(!queue().length) toast('تم رفع كل البيانات المحفوظة على الجهاز');
  render();
}

/* ---------- المسودة ---------- */
function openBranch(bid, round){
  const b = branchById(bid);
  const R = round ?? roundFor(b.sup_id);
  S.sel = bid; S.editRound = R; S.armed = null; S.waLink = null;
  const d = store.get(dKey());
  if(d && d.branch === bid && d.round === R){ S.draft = d; }
  else {
    const rd = readingAt(bid, R);
    S.draft = {branch:bid, round:R, cats: rd ? clone(rd.cats) : {}, open:null};
  }
  saveDraft(); render();
  setTimeout(() => { const el = document.getElementById('editor'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }, 30);
}
function saveDraft(){ if(S.draft) store.set(dKey(), S.draft); }
function closeBranch(){ S.sel = null; S.draft = null; S.editRound = null; S.waLink = null; store.del(dKey()); render(); }
function draftDirty(){
  if(!S.draft) return false;
  const rd = readingAt(S.draft.branch, S.draft.round);
  return JSON.stringify(S.draft.cats) !== JSON.stringify(rd ? rd.cats : {});
}

/* ===================== تسجيل الدخول ===================== */
async function boot(){
  if(S.sess){
    const cached = store.get('data:' + S.sess.id);
    if(cached){ S.data = cached; S.user = cached.user; restoreDraft(); render(); }
    try{ await loadData(); }
    catch(e){
      if(e.code === 'bad_pin' || e.code === 'locked'){ logout(); toast(e.message); return; }
      if(!S.data){ S.login.err = e.message; renderLogin(); return; }
      toast('شغال من البيانات المحفوظة على الجهاز');
    }
    syncQueue();
    return;
  }
  renderLogin();
  try{ S.users = await API.listUsers(); store.set('users-cache', S.users); renderLogin(); }
  catch(e){ if(!S.users.length){ S.login.err = e.message; renderLogin(); } }
}
async function loadData(){
  const d = await API.getData(S.sess.id, S.sess.pin);
  // نحتفظ بالقراءات اللي لسه ما اترفعتش
  const pend = S.data ? S.data.readings.filter(r => r.pending) : [];
  S.data = d; S.user = d.user;
  pend.forEach(p => { S.data.readings = S.data.readings.filter(x => !(x.branch_id === p.branch_id && x.round === p.round)); S.data.readings.push(p); });
  cacheData(); restoreDraft(); render();
}
function restoreDraft(){
  if(S.sel || !S.user) return;
  const d = store.get(dKey());
  if(!d || !branchById(d.branch)) return;
  const b = branchById(d.branch);
  if(S.user.role === 'sup' && d.round !== roundFor(b.sup_id) && !editable(b, d.round)){ store.del(dKey()); return; }
  S.draft = d; S.sel = d.branch; S.editRound = d.round;
}
function logout(){
  if(S.user){ store.del('data:' + S.user.id); }
  store.del('sess'); S.sess = null; S.user = null; S.data = null; S.sel = null; S.draft = null;
  S.login = {gov:'', uid:'', pin:'', err:''};
  boot();
}
async function doLogin(){
  const {uid, pin} = S.login;
  if(!uid){ S.login.err = 'اختار اسمك'; return renderLogin(); }
  if(!pin){ S.login.err = 'اكتب الرمز السري'; return renderLogin(); }
  S.busy = true; renderLogin();
  try{
    await API.login(uid, pin);
    S.sess = {id:uid, pin}; store.set('sess', S.sess);
    await loadData(); syncQueue();
  }catch(e){ S.login.err = e.message; S.busy = false; renderLogin(); }
  S.busy = false;
}

          ${L.gov ? inGroup(L.gov).map(u => `<option value="${u.id}" ${L.uid===u.id?'selected':''}>${esc(u.name)} — ${ROLES[u.role]}</option>`).join('') : ''}

function render(){
  if(!S.user || !S.data) return renderLogin();

/* ---------- مسؤول الفروع ---------- */
function renderSup(){
  const R = roundFor(S.user.id);
  const br = S.data.branches.filter(b => b.active);
  const st = br.map(b => ({b, s: branchStatus(b)}));
  const done = st.filter(x => x.s === 'done').length;
  return `
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2>فروعك</h2><span class="round-tag">القراءة رقم ${R}</span></div>

function statChips(total, done){
  const f = S.filter;
  return `<div class="grid3">
    <button class="stat ${f==='all'?'on':''}" data-act="filter" data-v="all"><b>${total}</b><span>إجمالي الفروع</span></button>

  </div>`;
}
function branchPicker(st){
  const f = S.filter, q = S.q.trim();
  let list = st.filter(x => f === 'all' || (f === 'done' ? x.s === 'done' : x.s !== 'done'));
  if(q) list = list.filter(x => x.b.name.includes(q));
  const lbl = {none:'لم تسجل', partial:'ناقص فئات', done:'مكتمل', pend:'على الجهاز — مستني الرفع'};

    <input type="text" id="bq" data-in="bq" placeholder="ابحث باسم الفرع" value="${esc(S.q)}">

    </div>`;
}

/* ---------- محرر القراءة ---------- */
function renderEditor(){
  const b = branchById(S.sel); if(!b) return '';
  const d = S.draft, R = d.round;
  const rd = readingAt(b.id, R);
  const can = editable(b, R);
  const sup = S.user.role === 'sup';
  // تعديل قراءة النهارده من القراءة السابقة
  const prevToday = sup ? S.data.readings.find(x => x.branch_id === b.id && x.round !== R && x.created_by === S.user.id && isToday(x.created_at)) : null;
  const cats = d.cats;
  const head = `
    <div class="row" style="justify-content:space-between">
      <div><h2>${esc(b.name)}</h2><div class="muted">${GOVS[b.gov]} · ${esc(userName(b.sup_id))}</div></div>

      ${summaryTable(rd.cats)}
      <div class="grid2"><button class="btn wa" data-act="share">مشاركة واتساب</button><button class="btn" data-act="close">رجوع للفروع</button></div>

    ${rd && rd.complete && sup ? `<div class="banner info">تقدر تعدل الفرع ده النهارده بس، وبعد كده يتقفل.</div>` : ''}
    ${rd && canEdit() ? `<div class="muted">آخر تعديل: ${fmtDate(rd.updated_at)} بواسطة ${esc(userName(rd.updated_by))}</div>` : ''}
    <div><span class="lbl">الفئات</span>
    <div class="cats">
      ${CATS.map(({k,n}) => { const c = cats[k];
        const stt = !c ? 'لم تسجل' : c.na ? 'غير متوفرة في الفرع' : `${fmtN(c.t)} / ${fmtN(c.a)} · ${fmtP(catPct(c))}`;
        return `<button class="cat ${c?(c.na?'na rec':'rec'):''} ${o&&o.k===k?'open':''}" data-act="cat" data-k="${k}"><b>${n}${c && (c.photo||c.photoData) ? ' 📷' : ''}</b><span class="st">${stt}</span></button>`; }).join('')}
    </div></div>
    ${o ? stageHtml(o) : ''}
    ${Object.keys(cats).length ? summaryTable(cats) : `<div class="muted">سجل الفئات الأربعة علشان الفرع يتحسب مكتمل.</div>`}
    <div class="grid2">
      <button class="btn primary" data-act="save" ${Object.keys(cats).length?'':'disabled'}>حفظ</button>
      <button class="btn wa" data-act="share" ${Object.keys(cats).length?'':'disabled'}>حفظ ومشاركة واتساب</button>
    </div>
    <div class="grid2">
      <button class="btn danger ${S.armed==='clear'?'armed':''}" data-act="clear">${S.armed==='clear'?'اضغط تاني للتأكيد':'مسح البيانات'}</button>
      <button class="btn" data-act="close">رجوع للفروع</button>
    </div>
    ${S.waLink ? `<a href="${esc(S.waLink)}" target="_blank" rel="noopener">لو واتساب ما فتحش، اضغط هنا</a>` : ''}

}
function stageHtml(o){
  const t = num(o.t), a = num(o.a);
  let msg = '', p = null;
  if(!o.na && t != null && a != null){
    if(t <= 0) msg = 'المساحة الكلية لازم تكون أكبر من صفر';
    else if(a < 0) msg = 'المساحة الفعلية لا يمكن أن تكون سالبة';
    else if(a > t) msg = 'المساحة الفعلية لا يمكن أن تكون أكبر من الكلية';
    else p = a / t;
  }
  const ok = o.na || (p != null);
  const n = CATS.find(c => c.k === o.k).n;
  const photo = o.photoData || (o.photo ? API.photoUrl(o.photo) : null);
  return `<div class="stage">
    <div class="row" style="justify-content:space-between"><b>${n}</b><button class="btn sm ghost" data-act="catclose">إغلاق</button></div>
    <label class="check"><input type="checkbox" id="stNa" data-in="stNa" ${o.na?'checked':''}> الفئة غير متوفرة في الفرع</label>
    ${o.na ? '' : `
    <div class="grid2">
      <div class="field"><label class="lbl" for="stT">المساحة الكلية</label><input id="stT" type="number" inputmode="decimal" step="any" min="0" data-in="stT" value="${esc(o.t ?? '')}" placeholder="0"></div>
      <div class="field"><label class="lbl" for="stA">المساحة الفعلية</label><input id="stA" type="number" inputmode="decimal" step="any" min="0" data-in="stA" value="${esc(o.a ?? '')}" placeholder="0"></div>
    </div>
    <div class="pct ${msg?'badv':''}" id="stP">${p != null ? fmtP(p) : '0%'}</div>
    <div class="err" id="stMsg">${msg}</div>`}
    <div class="row">
      <label class="btn sm" for="stPhoto">📷 ${photo ? 'تغيير صورة الرف' : 'صورة الرف (اختياري)'}</label>
      <input id="stPhoto" type="file" accept="image/*" capture="environment" hidden data-in="stPhoto">

    </div>
    <button class="btn primary" data-act="catsave" id="stSave" ${ok?'':'disabled'}>تسجيل</button>
  </div>`;

function summaryTable(cats){

    <tr class="tot"><td class="l">النسبة الإجمالية</td><td>${fmtN(tt)}</td><td>${fmtN(ta)}</td><td>${fmtP(tp)}</td></tr>

}

function readStage(){
  const o = S.draft && S.draft.open; if(!o) return;
  const T = document.getElementById('stT'), A = document.getElementById('stA');
  if(T) o.t = T.value; if(A) o.a = A.value;

function updateStageLive(){
  const o = S.draft.open; if(!o || o.na) return;
  const t = num(o.t), a = num(o.a);
  let msg = '', p = null;
  if(t != null && a != null){
    if(t <= 0) msg = 'المساحة الكلية لازم تكون أكبر من صفر';
    else if(a < 0) msg = 'المساحة الفعلية لا يمكن أن تكون سالبة';
    else if(a > t) msg = 'المساحة الفعلية لا يمكن أن تكون أكبر من الكلية';

  if(M) M.textContent = msg;
  if(B) B.disabled = p == null;
}

async function compress(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1000, s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.6);
  } finally { URL.revokeObjectURL(url); }
}

async function saveBranch(){
  readStage();
  const d = S.draft;
  if(!Object.keys(d.cats).length){ toast('سجل فئة واحدة على الأقل'); return false; }
  try{ checkCats(d.cats); }catch(e){ toast(e.message); return false; }
  const b = branchById(d.branch);
  const item = {branch:d.branch, round:d.round, cats:clone(d.cats)};
  S.busy = true;
  try{
    await pushOne(item);
    store.del(dKey());
    S.draft = {branch:d.branch, round:d.round, cats:clone(readingAt(d.branch, d.round).cats), open:null};
    const done = readingAt(d.branch, d.round).complete;
    toast(done ? 'تم الحفظ — الفرع مكتمل' : 'تم الحفظ — باقي فئات لم تسجل');
  }catch(e){
    if(e.code === 'network'){
      const q = queue().filter(x => !(x.branch === item.branch && x.round === item.round)); q.push(item); setQueue(q);
      applyLocal(item.branch, item.round, item.cats, {pending:true});
      store.del(dKey());
      S.draft = {branch:d.branch, round:d.round, cats:clone(item.cats), open:null};
      toast('اتحفظ على الجهاز، وهيترفع لوحده لما النت يرجع', 3500);
    } else { toast(e.message, 4000); S.busy = false; render(); return false; }
  }
  S.busy = false; render(); return true;
}
function shareText(bid, round, cats){
  const b = branchById(bid);
  const rd = readingAt(bid, round);
  let t = `📊 قراءة نسب المساحات\nالمحافظة: ${GOVS[b.gov]}\nالفرع: ${b.name}\nالمسؤول: ${userName(b.sup_id)}\nالقراءة رقم: ${round}\nالتاريخ: ${fmtDate(rd ? rd.updated_at : Date.now())}\n\n`;
  CATS.forEach(({k,n}) => { const c = cats[k];
    if(!c) t += `${n}: لم تسجل\n`;
    else if(c.na) t += `${n}: غير متوفرة في الفرع\n`;
    else t += `${n}: الكلية ${fmtN(c.t)} | الفعلية ${fmtN(c.a)} | ${fmtP(catPct(c))}\n`;
  });
  t += `\nالنسبة الإجمالية: ${fmtP(totalPct(cats))}`;
  if(S.user.role === 'sup' || S.user.id !== b.sup_id) t += `\nأرسلها: ${S.user.name}`;
  return t;
}

function loadExcelJS(){
  if(window.ExcelJS) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js'; s.onload = res; s.onerror = () => rej(mkErr('تعذر تحميل مكتبة الإكسيل — تأكد من الإنترنت')); document.head.appendChild(s); });

const PAL = [['0F766E','D5ECE9'],['6D28D9','E7DFFB'],['B45309','F9E7D0'],['1D4ED8','DBE5FB'],['BE185D','F9DCE8'],['4D7C0F','E4EFD2']];
async function exportExcel(){

  const br = sup ? S.data.branches.filter(b => b.active) : scopeBranches(true).filter(b => b.active || readingsOf(b.id).length);
  let rounds;
  if(sup) rounds = [roundFor(S.user.id)];
  else rounds = [...new Set(br.flatMap(b => readingsOf(b.id).map(r => r.round)))].sort((a,b) => a-b);
  if(!rounds.length) rounds = [1];
  const wb = new ExcelJS.Workbook(); wb.creator = 'حاسبة نسب المساحات';
  const ws = wb.addWorksheet('القراءات', {views:[{rightToLeft:true, state:'frozen', xSplit:3, ySplit:3}]});
  const BL = 16, base = 4;
  const thin = {style:'thin', color:{argb:'FFBFC8C6'}};
  const border = {top:thin, left:thin, bottom:thin, right:thin};
  const fill = c => ({type:'pattern', pattern:'solid', fgColor:{argb:'FF'+c}});
  const hdr = (cell, v, bg, fg='FFFFFF', bold=true) => { cell.value = v; cell.fill = fill(bg); cell.font = {bold, color:{argb:'FF'+fg}, name:'Arial', size:11}; cell.alignment = {horizontal:'center', vertical:'middle', wrapText:true}; cell.border = border; };
  // الأعمدة الثابتة
  [['المحافظة',12],['الفرع',32],['المسؤول',16]].forEach(([n,w],i) => { ws.mergeCells(1,i+1,3,i+1); hdr(ws.getCell(1,i+1), n, '334155'); ws.getColumn(i+1).width = w; });
  rounds.forEach((r, ri) => {
    const [dark, light] = PAL[ri % PAL.length];
    const c0 = base + ri*BL;
    const dates = br.map(b => readingAt(b.id, r)).filter(Boolean).map(x => x.created_at).sort();
    const range = dates.length ? `من ${fmtDate(dates[0])} إلى ${fmtDate(dates[dates.length-1])}` : 'لم تبدأ';

    [...CATS.map(c => c.n), 'الإجمالي'].forEach((n, ci) => {

      ['الكلية','الفعلية','النسبة'].forEach((s, si) => { hdr(ws.getCell(3, cc+si), s, light, '1F2937', false); ws.getColumn(cc+si).width = si === 2 ? 10 : 9; });
    });
  });
  ws.getRow(1).height = 24; ws.getRow(2).height = 20;
  const GOOD = ['C6EFCE','006100'], BAD = ['FFC7CE','9C0006'], NA = ['E5E7EB','6B7280'];
  br.forEach((b, i) => {
    const row = ws.getRow(4 + i);
    row.getCell(1).value = GOVS[b.gov]; row.getCell(2).value = b.name + (b.active ? '' : ' (موقوف)'); row.getCell(3).value = userName(b.sup_id);
    [1,2,3].forEach(c => { row.getCell(c).border = border; row.getCell(c).alignment = {vertical:'middle'}; });
    const hist = readingsOf(b.id);
    rounds.forEach((r, ri) => {
      const c0 = base + ri*BL;
      const rd = readingAt(b.id, r);
      const prev = sup ? null : (hist.filter(x => x.round < r).pop() || null);
      for(let k = 0; k < BL; k++) row.getCell(c0+k).border = border;
      if(!rd) return;
      row.getCell(c0).value = fmtDate(rd.created_at);
      const put = (cc, c, pc) => {
        if(!c) return;
        if(c.na){ ws.mergeCells(row.number, cc, row.number, cc+2); const x = row.getCell(cc); x.value = 'غير متوفر'; x.fill = fill(NA[0]); x.font = {color:{argb:'FF'+NA[1]}}; x.alignment = {horizontal:'center'}; return; }
        row.getCell(cc).value = +c.t; row.getCell(cc+1).value = +c.a;
        const p = row.getCell(cc+2); p.value = c.t > 0 ? c.a / c.t : null; p.numFmt = '0.00%';
        if(pc != null && p.value != null){ const [bg, fg] = p.value >= pc ? GOOD : BAD; p.fill = fill(bg); p.font = {bold:true, color:{argb:'FF'+fg}}; }
      };
      CATS.forEach(({k}, ci) => { const pc = prev && prev.cats[k] && !prev.cats[k].na ? catPct(prev.cats[k]) : null; put(c0+1+ci*3, rd.cats[k], pc); });
      let t=0,a=0; CATS.forEach(({k}) => { const c = rd.cats[k]; if(c && !c.na){ t+=+c.t; a+=+c.a; } });
      if(t > 0) put(c0+13, {t, a}, prev ? totalPct(prev.cats) : null);
      [c0+13, c0+14, c0+15].forEach(c => { const x = row.getCell(c); x.font = {...(x.font||{}), bold:true}; });
    });
  });
  // الملخص
  const ws2 = wb.addWorksheet('الملخص', {views:[{rightToLeft:true}]});
  const head = ['المسؤول','المحافظة','القراءة الحالية','إجمالي الفروع','اتسجلت','المتبقي','نسبة الإنجاز'];
  head.forEach((h,i) => { hdr(ws2.getCell(1,i+1), h, '334155'); ws2.getColumn(i+1).width = i ? 15 : 22; });
  const supIds = sup ? [S.user.id] : [...new Set(br.map(b => b.sup_id))];
  supIds.forEach((id, i) => {
    const mine = br.filter(b => b.sup_id === id && b.active), R = roundFor(id);
    const done = mine.filter(b => { const r = readingAt(b.id, R); return r && r.complete; }).length;
    const u = S.data.users.find(x => x.id === id) || S.user;
    const vals = [userName(id), GOVS[u.gov] || '', R, mine.length, done, mine.length - done, mine.length ? done/mine.length : 0];
    vals.forEach((v,c) => { const x = ws2.getCell(i+2, c+1); x.value = v; x.border = border; if(c === 6) x.numFmt = '0%'; });
  });
  const buf = await wb.xlsx.writeBuffer();
  const scope = sup ? S.user.name : (S.f.sup !== 'all' ? userName(S.f.sup) : S.f.gov !== 'all' ? GOVS[S.f.gov] : 'كل المحافظات');
  const name = `نسب_المساحات_${scope}_${cairoDate(Date.now())}.xlsx`.replace(/\s+/g,'_');
  await saveFile(name, new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}
async function saveFile(name, blob){
  try{
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if(dl){ await dl.save({filename:name, data:blob}); return; }
  }catch(e){ if(e && e.code === 'declined') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('تم تنزيل ملف الإكسيل');
}

/* ===================== الأحداث ===================== */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act;
  if(el.tagName === 'A' && el.getAttribute('href') === '#') ev.preventDefault();
  if(act !== 'clear' && act !== 'delread' && S.armed){ S.armed = null; }
  try{
  switch(act){
    case 'login': return doLogin();
    case 'logout': return logout();
    case 'refresh': try{ await loadData(); await syncQueue(); toast('تم التحديث'); }catch(e){ toast(e.message); } return;
    case 'sync': return syncQueue();
    case 'filter': S.filter = el.dataset.v; return render();
    case 'open': {
      const id = +el.dataset.id;
      if(isMgr()){ S.sel = id; S.draft = null; S.editRound = null; render(); setTimeout(() => document.getElementById('history')?.scrollIntoView({behavior:'smooth'}), 30); return; }
      return openBranch(id);
    }
    case 'goto': S.tab = 'branches'; S.sel = +el.dataset.id; S.draft = null; render(); setTimeout(() => document.getElementById('history')?.scrollIntoView({behavior:'smooth'}), 30); return;
    case 'close': return closeBranch();
    case 'editprev': return openBranch(S.sel, +el.dataset.r);
    case 'mgredit': openBranch(S.sel, +el.dataset.r); S.draft.editing = true; saveDraft(); return render();
    case 'cat': {
      readStage();
      const k = el.dataset.k, c = S.draft.cats[k];
      S.draft.open = {k, t: c && !c.na ? c.t : '', a: c && !c.na ? c.a : '', na: !!(c && c.na), photo: c && c.photo, photoData: c && c.photoData};
      saveDraft(); render(); setTimeout(() => document.getElementById('stT')?.focus(), 30); return;
    }
    case 'catclose': readStage(); S.draft.open = null; saveDraft(); return render();
    case 'catsave': {
      readStage();
      const o = S.draft.open; let v;
      if(o.na) v = {na:true};
      else { const t = num(o.t), a = num(o.a);
        if(t == null || a == null || t <= 0 || a < 0){ toast('اكتب المساحة الكلية والفعلية'); return; }
        if(a > t){ toast(ERRS.actual_gt_total); return; }
        v = {t, a}; }
      if(o.photo) v.photo = o.photo; if(o.photoData) v.photoData = o.photoData;
      S.draft.cats[o.k] = v; S.draft.open = null;
      // افتح الفئة الجاية اللي لسه ما اتسجلتش
      saveDraft(); return render();
    }
    case 'rmphoto': delete S.draft.open.photo; delete S.draft.open.photoData; saveDraft(); return render();
    case 'viewphoto': { const pv = document.getElementById('pv'); document.getElementById('pvImg').src = el.dataset.src; pv.hidden = false; return; }
    case 'save': if(!S.busy) await saveBranch(); return;
    case 'share': return share();
    case 'clear':
      if(S.armed !== 'clear'){ S.armed = 'clear'; render(); setTimeout(() => { if(S.armed === 'clear'){ S.armed = null; render(); } }, 3500); return; }
      S.armed = null; S.draft.cats = {}; S.draft.open = null; saveDraft(); toast('اتمسحت البيانات من الشاشة. سجل الفئات من جديد واضغط حفظ.'); return render();
    case 'excel': try{ await exportExcel(); }catch(e){ toast(e.message || 'تعذر استخراج الإكسيل', 4000); } return;
    case 'tab': S.tab = el.dataset.v; S.sel = null; S.draft = null; return render();
    case 'delread': {
      const id = el.dataset.id;
      if(S.armed !== 'del'+id){ S.armed = 'del'+id; return render(); }
      S.armed = null; await API.deleteReading(S.sess.id, S.sess.pin, isNaN(+id) ? id : +id);
      S.data.readings = S.data.readings.filter(r => String(r.id) !== id); cacheData(); toast('تم حذف القراءة'); return render();
    }
    case 'usave': {
      const id = el.dataset.id, g = x => document.getElementById(x + '-' + id);
      const u = {id: id === 'new' ? 'u' + Date.now().toString(36) : id, name: g('un').value, role: g('ur').value, gov: g('ug').value || null, active: g('ua').checked, pin: g('up').value.trim() || null};
      if(!u.name.trim()){ toast('اكتب الاسم'); return; }
      if(u.role !== 'admin' && u.role !== 'analyst' && !u.gov){ toast('اختار المحافظة'); return; }
      await API.saveUser(S.sess.id, S.sess.pin, u);
      if(u.id === S.sess.id && u.pin){ S.sess.pin = u.pin; store.set('sess', S.sess); }
      await loadData(); toast(u.pin ? 'اتحفظ والرمز الجديد شغال' : 'اتحفظ'); return;
    }
    case 'bsave': {
      const id = el.dataset.id;
      const b = id === 'new' ? {id:null, name:document.getElementById('nbName').value, gov:document.getElementById('nbGov').value, sup_id:document.getElementById('nbSup').value, active:true}
        : {id:+id, name:document.getElementById('bn-'+id).value, gov:document.getElementById('bg-'+id).value, sup_id:document.getElementById('bs-'+id).value, active:document.getElementById('ba-'+id).checked};
      if(!b.name.trim()){ toast('اكتب اسم الفرع'); return; }
      await API.saveBranch(S.sess.id, S.sess.pin, b);
      await loadData(); toast(id === 'new' ? 'تمت إضافة الفرع' : 'اتحفظ'); return;
    }
  }
  }catch(e){ toast(e.message || 'حصل خطأ', 4000); }
});
document.getElementById('pv').addEventListener('click', () => document.getElementById('pv').hidden = true);

document.addEventListener('input', ev => {
  const el = ev.target, k = el.dataset && el.dataset.in; if(!k) return;
  if(k === 'lgPin'){ S.login.pin = el.value; return; }
  if(k === 'bq'){ S.q = el.value; const pos = el.selectionStart; render(); const n = document.getElementById('bq'); n.focus(); n.setSelectionRange(pos,pos); return; }
  if(k === 'aq'){ S.aq = el.value; const pos = el.selectionStart; render(); const n = document.getElementById('aq'); n.focus(); n.setSelectionRange(pos,pos); return; }
  if(k === 'stT' || k === 'stA'){ readStage(); saveDraft(); updateStageLive(); return; }
});
document.addEventListener('change', async ev => {
  const el = ev.target, k = el.dataset && el.dataset.in; if(!k) return;
  if(k === 'lgGov'){ S.login.gov = el.value; S.login.uid = ''; S.login.err = ''; return renderLogin(); }
  if(k === 'lgUser'){ S.login.uid = el.value; S.login.err = ''; return; }
  if(k === 'fGov'){ S.f.gov = el.value; S.f.sup = 'all'; S.sel = null; return render(); }
  if(k === 'fSup'){ S.f.sup = el.value; S.sel = null; return render(); }
  if(k === 'stNa'){ readStage(); S.draft.open.na = el.checked; saveDraft(); return render(); }
  if(k === 'stPhoto' && el.files && el.files[0]){
    readStage();
    try{ S.draft.open.photoData = await compress(el.files[0]); delete S.draft.open.photo; saveDraft(); }catch(e){ toast('تعذر قراءة الصورة'); }
    return render();
  }
});
document.addEventListener('keydown', ev => { if(ev.key === 'Enter' && ev.target.id === 'lgPin') doLogin(); });
window.addEventListener('online', () => { S.online = true; render(); syncQueue(); });
window.addEventListener('offline', () => { S.online = false; render(); });
setInterval(() => { if(S.user && queue().length && navigator.onLine) syncQueue(); }, 30000);

boot();
</script>
