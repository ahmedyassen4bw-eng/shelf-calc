<style>
/* Layout: one narrow mobile column for supervisors; managers get the same column widened for tables. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --sunken:#f4f7f6; --ink:#16211f; --muted:#5a6966; --line:#d8e1df;
  --accent:#0f766e; --accent-strong:#0b5a54; --accent-soft:#dcefeb; --on-accent:#ffffff;
  --good:#15803d; --good-soft:#dcf5e3; --bad:#b42318; --bad-soft:#fde3e0; --warn:#a15c07; --warn-soft:#fdf0d5;
  --na:#7d8a87; --na-soft:#e9eeed; --wa:#1d9e4f;
  --font:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101716; --surface:#18211f; --sunken:#131b19; --ink:#e4ecea; --muted:#9aaba7; --line:#2b3835;
    --accent:#2bb3a4; --accent-strong:#46c9ba; --accent-soft:#163633; --on-accent:#05201d;
    --good:#4ade80; --good-soft:#153524; --bad:#f87171; --bad-soft:#3b1717; --warn:#fbbf24; --warn-soft:#3a2c0d;
    --na:#8b9895; --na-soft:#222c2a; --wa:#25c060; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101716; --surface:#18211f; --sunken:#131b19; --ink:#e4ecea; --muted:#9aaba7; --line:#2b3835;
  --accent:#2bb3a4; --accent-strong:#46c9ba; --accent-soft:#163633; --on-accent:#05201d;
  --good:#4ade80; --good-soft:#153524; --bad:#f87171; --bad-soft:#3b1717; --warn:#fbbf24; --warn-soft:#3a2c0d;
  --na:#8b9895; --na-soft:#222c2a; --wa:#25c060; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.wrap.wide{max-width:1000px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-weight:600;font-size:18px;letter-spacing:-.01em;text-wrap:balance}
.brand small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);letter-spacing:0}
.who{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:15.5px;font-weight:600}
.lbl{font-size:13px;color:var(--muted);margin-bottom:4px;display:block}
.field{display:flex;flex-direction:column;min-width:0}
input[type=text],input[type=number],input[type=password],input[type=tel],select{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunken);font-size:15px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{border-radius:10px;padding:11px 14px;font-weight:600;cursor:pointer;background:var(--sunken);border:1px solid var(--line);text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.wa{background:var(--wa);color:#fff;border-color:var(--wa)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;font-weight:500}
.btn.lang{font-weight:600;border-color:var(--accent);color:var(--accent-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 150px;min-width:0}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--bad);font-size:13px}
.banner{border-radius:10px;padding:9px 12px;font-size:13px;background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--accent-strong)}
.stat{border:1px solid var(--line);background:var(--sunken);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer}
.stat b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.stat.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stat.on span{color:var(--on-accent)}
.round-tag{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);color:var(--accent-strong);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{border:1px solid var(--line);background:var(--sunken);border-radius:10px;padding:10px;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:2px}
.cat b{font-size:15px;font-weight:600}
.cat .st{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cat.rec{border-color:var(--accent)}
.cat.rec .st{color:var(--accent-strong);font-weight:600}
.cat.rec.below{border-color:var(--bad)} .cat.rec.below .st{color:var(--bad)}
.cat.rec.above{border-color:var(--good)} .cat.rec.above .st{color:var(--good)}
.cat.na .st{color:var(--na);font-weight:500}
.cat.open{outline:2px solid var(--accent)}
.stage{border:1px dashed var(--accent);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--sunken)}
.pct{text-align:center;font-size:26px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.pct.badv{color:var(--bad)} .pct.below{color:var(--bad)} .pct.above{color:var(--good)}
.gapline{text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:center;white-space:nowrap}
th{background:var(--sunken);font-weight:600;font-size:12.5px;color:var(--muted)}
td.l,th.l{text-align:start}
tr.tot td{font-weight:600;background:var(--sunken)}
td small{display:block;font-size:11.5px;font-weight:500}
.up{background:var(--good-soft);color:var(--good);font-weight:600}
.down{background:var(--bad-soft);color:var(--bad);font-weight:600}
.nacell{background:var(--na-soft);color:var(--na)}
.trend{font-size:11px;opacity:.8;margin-inline-start:3px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:none;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent-strong);border-bottom-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:0 6px;border-radius:5px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.gallery figure{margin:0;display:flex;flex-direction:column;gap:4px}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.gallery figcaption{font-size:12px;color:var(--muted)}
tr.dirty td{background:var(--warn-soft)}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.15)}
.savebar b{font-weight:600}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,130px));gap:10px}
.strip .tile{display:flex;flex-direction:column;gap:4px;min-width:0}
.strip .ph{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--sunken);display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);text-align:center;padding:4px;overflow:hidden}
.strip img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}
.strip b{font-size:12.5px;font-weight:600}
.strip small{font-size:11px;color:var(--muted)}
.asv{font-size:12.5px;color:var(--muted)} .asv.ok{color:var(--good)} .asv.err{color:var(--bad)}
.photo-btn{border:none;background:none;cursor:pointer;padding:0 2px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center}
.photo-view{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;z-index:60;padding:20px;color:#fff}
.photo-view img{max-height:82vh;border-radius:8px}
a{color:var(--accent-strong)}
@media (max-width:420px){.grid3{gap:6px}.stat b{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

const CAT_KEYS = ['yog','drk','pud','milk'];
const GOV_KEYS = ['Cairo','Giza','Alex'];

/* ===================== Utilities ===================== */
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
let LANG = store.get('lang') || 'en';
function t(key, vars){
  let s = I18N[LANG][key]; if(s == null) s = I18N.en[key]; if(s == null) return key;
  if(vars && typeof s === 'string') for(const [k,v] of Object.entries(vars)) s = s.split('{'+k+'}').join(v);
  return s;
}
const catName = k => I18N[LANG].cats[k];
const govName = g => g ? I18N[LANG].govs[g] || g : '';
const roleName = r => I18N[LANG].roles[r] || r;
const jobTitle = u => (u && u.title) || roleName(u && u.role);
function applyLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.title = t('appTitle');
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const cairoDate = ts => new Date(ts).toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'});
const isToday = ts => ts && cairoDate(ts) === cairoDate(Date.now());
const fmtDate = ts => { const d = cairoDate(ts).split('-'); return `${d[2]}/${d[1]}/${d[0]}`; };
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? null : n; };
const fmtN = n => (Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const fmtP = p => p == null ? '—' : (p*100).toFixed(2) + '%';
const fmtT = p => p == null ? '—' : (+(p*100).toFixed(2)) + '%';
function mkErr(code){ const e = new Error(I18N[LANG].errs[code] || code); e.code = code; return e; }
function catPct(c){ if(!c || c.na) return null; return c.t > 0 ? c.a / c.t : null; }
function totalPct(cats){
  let tt = 0, a = 0, any = false;
  CAT_KEYS.forEach(k => { const c = cats && cats[k]; if(c && !c.na){ tt += +c.t; a += +c.a; any = true; } });
  return any && tt > 0 ? a / tt : null;
}
function checkCats(cats){
  let n = 0;
  for(const [k,v] of Object.entries(cats || {})){
    if(!CAT_KEYS.includes(k)) throw mkErr('invalid');
    if(v.na){ n++; continue; }
    const tt = num(v.t), a = num(v.a);
    if(tt == null || a == null || tt <= 0 || a < 0) throw mkErr('invalid');
    if(a > tt) throw mkErr('actual_gt_total');
    n++;
  }
  return n === 4;
}

/* ---------- Targets ---------- */
const targets = () => (S.data && S.data.targets) || {};
const hasTargets = () => CAT_KEYS.some(k => targets()[k] != null);
// gap for one category: null when no target is set
function catGap(k, c){
  const tg = targets()[k]; const p = catPct(c);
  if(tg == null || p == null) return null;
  return {target:tg, pct:p, pts:(tg - p)*100, shelf: tg * c.t - c.a, below: p < tg};
}
// overall target, weighted by the shelf size of categories that have a target
// (a category without a target counts as already on target, so it neither adds nor hides a gap)
function totalGap(cats){
  let tt=0, a=0, need=0, any=false;
  CAT_KEYS.forEach(k => { const c = cats && cats[k], tg = targets()[k];
    if(c && !c.na){ tt+=+c.t; a+=+c.a; if(tg != null){ need += tg*c.t; any=true; } else need += +c.a; } });
  if(!any || !tt) return null;
  const tg = need/tt, p = a/tt;
  return {target:tg, pct:p, pts:(tg-p)*100, shelf:need - a, below: p < tg};
}
// colour for a share: against target first, otherwise against the previous reading
function shareClass(p, target, prev){
  if(p == null) return '';
  if(target != null) return p >= target ? 'up' : 'down';
  if(prev != null) return p >= prev ? 'up' : 'down';
  return '';
}

/* ===================== Database: Supabase ===================== */
function authHeaders(ct){
  const h = {'apikey':CONFIG.SUPABASE_KEY,'Content-Type':ct};
  if(!CONFIG.SUPABASE_KEY.startsWith('sb_')) h['Authorization'] = 'Bearer ' + CONFIG.SUPABASE_KEY;
  return h;
}
class RemoteBackend {
  async rpc(fn, args){
    let res;
    try{ res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${fn}`, {method:'POST', headers:authHeaders('application/json'), body: JSON.stringify(args || {})}); }
    catch(e){ throw mkErr('network'); }
    const body = await res.json().catch(() => null);
    if(!res.ok) throw mkErr(body && body.message || 'server');
    if(body && body.error) throw mkErr(body.error);
    return body;
  }
  listUsers(){ return this.rpc('list_users'); }
  login(u,p){ return this.rpc('login',{p_user:u,p_pin:p}); }
  getData(u,p){ return this.rpc('get_data',{p_user:u,p_pin:p}); }
  saveReading(u,p,branch,cats,round){ return this.rpc('save_reading',{p_user:u,p_pin:p,p_branch:branch,p_cats:cats,p_round:round ?? null}); }
  deleteReading(u,p,id){ return this.rpc('admin_delete_reading',{p_user:u,p_pin:p,p_id:id}); }
  saveBranch(u,p,b){ return this.rpc('admin_save_branch',{p_user:u,p_pin:p,p_id:b.id ?? null,p_gov:b.gov,p_name:b.name,p_sup:b.sup_id,p_active:b.active}); }
  saveUser(u,p,x){ return this.rpc('admin_save_user',{p_user:u,p_pin:p,p_id:x.id,p_name:x.name,p_role:x.role,p_gov:x.gov || null,p_active:x.active,p_new_pin:x.pin || null,p_title:x.title || null}); }
  saveTargets(u,p,tg){ return this.rpc('admin_save_targets',{p_user:u,p_pin:p,p_targets:tg}); }
  savePhoto(u,p,branch,cat,data,round){ return this.rpc('save_photo',{p_user:u,p_pin:p,p_branch:branch,p_cat:cat,p_data:data,p_round:round}); }
  getPhotos(u,p,branch){ return this.rpc('get_photos',{p_user:u,p_pin:p,p_branch:branch}); }
  photoIndex(u,p){ return this.rpc('photo_index',{p_user:u,p_pin:p}); }
  async uploadPhoto(dataUrl, path){
    const blob = await (await fetch(dataUrl)).blob();
    let res;
    try{ res = await fetch(`${CONFIG.SUPABASE_URL}/storage/v1/object/shelves/${path}`, {method:'POST', headers:authHeaders('image/jpeg'), body: blob}); }
    catch(e){ throw mkErr('network'); }
    if(!res.ok) throw mkErr('photo');
    return path;
  }
  photoUrl(ref){ return ref && ref.startsWith('data:') ? ref : `${CONFIG.SUPABASE_URL}/storage/v1/object/public/shelves/${ref}`; }
}

/* ===================== Demo backend (this device only) ===================== */
class LocalBackend {
  constructor(){
    this.db = store.get('demo-db2');
    if(!this.db){
      this.db = { users: SEED.users.map(u => ({...u, pin:'1234', active:true, title:null})), branches: clone(SEED.branches), readings: [], seq: 1, targets:{} };
      this.persist();
    }
  }
  persist(){ store.set('demo-db2', this.db); }
  auth(id, pin){ const u = this.db.users.find(x => x.id === id && x.active !== false); if(!u || u.pin !== pin) throw mkErr('bad_pin'); return u; }
  pub(u){ return {id:u.id,name:u.name,role:u.role,gov:u.gov,title:u.title||null}; }
  supRound(sid){
    const mine = this.db.branches.filter(b => b.sup_id === sid), ids = new Set(mine.map(b => b.id));
    const rs = this.db.readings.filter(r => ids.has(r.branch_id));
    const r = rs.reduce((m,x) => Math.max(m, x.round), 0);
    if(r === 0) return 1;
    return mine.some(b => b.active && !rs.some(x => x.branch_id === b.id && x.round === r && x.complete)) ? r : r + 1;
  }
  async listUsers(){ return this.db.users.filter(u => u.active !== false).map(u => this.pub(u)); }
  async login(id,pin){ return this.pub(this.auth(id,pin)); }
  async getData(id,pin){
    const u = this.auth(id,pin);
    if(u.role === 'sup'){
      const r = this.supRound(u.id), br = this.db.branches.filter(b => b.sup_id === u.id && b.active), ids = new Set(br.map(b => b.id));
      const rd = this.db.readings.filter(x => ids.has(x.branch_id) && (x.round === r || (x.created_by === u.id && isToday(x.created_at))));
      return clone({user:this.pub(u), round:r, branches:br, readings:rd, users:[], targets:this.db.targets});
    }
    const all = u.role === 'admin' || u.role === 'analyst';
    const br = this.db.branches.filter(b => all || b.gov === u.gov), ids = new Set(br.map(b => b.id));
    return clone({user:this.pub(u), round:null, branches:br, readings:this.db.readings.filter(x => ids.has(x.branch_id)),
      users:this.db.users.map(x => ({id:x.id,name:x.name,role:x.role,gov:x.gov,title:x.title||null,active:x.active !== false})), targets:this.db.targets});
  }
  async saveReading(id,pin,branchId,cats,round){
    const u = this.auth(id,pin), b = this.db.branches.find(x => x.id === branchId);
    if(!b) throw mkErr('no_branch');
    const done = checkCats(cats); let r;
    if(u.role === 'sup'){
      if(b.sup_id !== u.id || !b.active) throw mkErr('forbidden');
      r = this.supRound(u.id);
      if(round != null && round !== r){
        const ex = this.db.readings.find(x => x.branch_id === branchId && x.round === round);
        if(!ex || ex.created_by !== u.id || !isToday(ex.created_at)) throw mkErr('locked_reading');
        r = round;
      }
      const ex = this.db.readings.find(x => x.branch_id === branchId && x.round === r);
      if(ex && ex.complete && !(ex.created_by === u.id && isToday(ex.created_at))) throw mkErr('locked_reading');
    } else {
      if(u.role === 'gov' && b.gov !== u.gov) throw mkErr('forbidden');
      if(round == null) throw mkErr('invalid');
      r = round;
    }
    const now = new Date().toISOString();
    let ex = this.db.readings.find(x => x.branch_id === branchId && x.round === r);
    if(ex) Object.assign(ex, {cats:clone(cats), complete:done, updated_at:now, updated_by:u.id});
    else { ex = {id:this.db.seq++, branch_id:branchId, round:r, sup_id:b.sup_id, cats:clone(cats), complete:done, created_at:now, updated_at:now, created_by:u.id, updated_by:u.id}; this.db.readings.push(ex); }
    this.persist();
    return clone({reading:ex, round: u.role === 'sup' ? this.supRound(u.id) : null});
  }
  async deleteReading(id,pin,rid){ const u = this.auth(id,pin); if(u.role !== 'admin') throw mkErr('forbidden'); this.db.readings = this.db.readings.filter(x => x.id !== rid); this.persist(); return {ok:true}; }
  async saveBranch(id,pin,b){
    const u = this.auth(id,pin); if(u.role !== 'admin') throw mkErr('forbidden');
    if(!String(b.name||'').trim()) throw mkErr('invalid');
    let x;
    if(b.id == null){ x = {id: Math.max(0,...this.db.branches.map(y=>y.id))+1, gov:b.gov, name:b.name.trim(), sup_id:b.sup_id, active:b.active !== false, sort: this.db.branches.length+1}; this.db.branches.push(x); }
    else { x = this.db.branches.find(y => y.id === b.id); Object.assign(x, {gov:b.gov, name:b.name.trim(), sup_id:b.sup_id, active:b.active !== false}); }
    this.persist(); return clone(x);
  }
  async saveUser(id,pin,x){
    const u = this.auth(id,pin); if(u.role !== 'admin') throw mkErr('forbidden');
    if(x.pin && !/^[0-9]{4,8}$/.test(x.pin)) throw mkErr('bad_new_pin');
    let y = this.db.users.find(z => z.id === x.id);
    if(y){ Object.assign(y, {name:(x.name||'').trim()||y.name, role:x.role, gov:x.gov||null, title:(x.title||'').trim()||null, active:x.active !== false}); if(x.pin) y.pin = x.pin; }
    else { if(!x.pin) throw mkErr('bad_new_pin'); this.db.users.push({id:x.id,name:x.name.trim(),role:x.role,gov:x.gov||null,title:(x.title||'').trim()||null,active:x.active !== false,pin:x.pin}); }
    this.persist(); return {ok:true};
  }
  async saveTargets(id,pin,tg){ const u = this.auth(id,pin); if(u.role !== 'admin') throw mkErr('forbidden'); this.db.targets = clone(tg); this.persist(); return {ok:true, targets:tg}; }
  canBranch(u, b, write){ return u.role === 'admin' || u.role === 'analyst' || (u.role === 'gov' ? b.gov === u.gov : b.sup_id === u.id && (b.active || !write)); }
  async savePhoto(id,pin,branch,cat,data,round){
    const u = this.auth(id,pin), b = this.db.branches.find(x => x.id === branch);
    if(!b) throw mkErr('no_branch'); if(!this.canBranch(u,b,true)) throw mkErr('forbidden');
    this.db.photos = this.db.photos || {}; const now = new Date().toISOString();
    this.db.photos[branch+':'+cat] = {data, round, updated_at:now}; this.persist();
    return {ok:true, ref:'db:'+Date.parse(now)};
  }
  async getPhotos(id,pin,branch){
    const u = this.auth(id,pin), b = this.db.branches.find(x => x.id === branch);
    if(!b) throw mkErr('no_branch'); if(!this.canBranch(u,b,false)) throw mkErr('forbidden');
    const out = {}; Object.entries(this.db.photos || {}).forEach(([k,v]) => { const [bid,cat] = k.split(':'); if(+bid === branch) out[cat] = v; });
    return clone(out);
  }
  async photoIndex(id,pin){
    const u = this.auth(id,pin), out = {};
    Object.entries(this.db.photos || {}).forEach(([k,v]) => { const [bid,cat] = k.split(':'); const b = this.db.branches.find(x => x.id === +bid);
      if(b && this.canBranch(u,b,false)) (out[bid] = out[bid] || {})[cat] = {round:v.round, updated_at:v.updated_at}; });
    return out;
  }
  async uploadPhoto(dataUrl){ return dataUrl; }
  photoUrl(ref){ return ref; }
}

/* ===================== State ===================== */
const S = {
  sess: store.get('sess'), user: null, data: null, users: store.get('users-cache') || [],
  login: {gov:'', uid:'', pin:'', err:''},
  filter: 'all', sel: null, editRound: null, draft: null,
  tab: 'dash', f: {gov:'all', sup:'all'}, aq: '', edits: {}, photos: {}, photoIdx: {}, asv: {state:'idle'}, saving: false,
  armed: null, online: navigator.onLine, busy: false, waLink: null
};
const qKey = () => 'queue:' + S.user.id;
const dKey = () => 'drafts:' + S.user.id;
const oKey = () => 'open:' + S.user.id;
const draftId = (b, r) => b + ':' + r;
const allDrafts = () => (S.user && store.get(dKey())) || {};
function dropDraft(b, r){ const all = allDrafts(); delete all[draftId(b, r)]; store.set(dKey(), all); }
function hasDraft(b){ return Object.entries(allDrafts()).some(([k, d]) => k.split(':')[0] === String(b) && S.data && draftDirty(d)); }
const isMgr = () => S.user && S.user.role !== 'sup';
const canEdit = () => S.user && ['gov','analyst','admin'].includes(S.user.role);
const isAdmin = () => S.user && S.user.role === 'admin';
function toast(msg, ms=2600){ const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, ms); }

/* ---------- Readings ---------- */
const readingsOf = bid => S.data.readings.filter(r => r.branch_id === bid).sort((a,b) => a.round - b.round);
const readingAt = (bid, round) => S.data.readings.find(r => r.branch_id === bid && r.round === round);
const branchById = id => S.data.branches.find(b => b.id === id);
const findUser = id => (S.data && S.data.users.find(u => u.id === id)) || S.users.find(u => u.id === id) || (S.user && S.user.id === id ? S.user : null);
const userName = id => (findUser(id) || {}).name || '—';

function roundFor(supId){
  const mine = S.data.branches.filter(b => b.sup_id === supId), ids = new Set(mine.map(b => b.id));
  const rs = S.data.readings.filter(r => ids.has(r.branch_id));
  let r = rs.reduce((m,x) => Math.max(m, x.round), 0);
  if(S.user.role === 'sup') r = Math.max(r, S.data.round || 1);
  if(r === 0) return 1;
  return mine.some(b => b.active && !rs.some(x => x.branch_id === b.id && x.round === r && x.complete)) ? r : r + 1;
}
function branchStatus(b){
  const rd = readingAt(b.id, roundFor(b.sup_id));
  if(!rd) return 'none';
  if(rd.pending) return 'pend';
  return rd.complete ? 'done' : 'partial';
}
function editable(b, round){
  if(canEdit()) return true;
  const R = roundFor(b.sup_id), rd = readingAt(b.id, round);
  if(round === R) return !rd || !rd.complete || (rd.created_by === S.user.id && isToday(rd.created_at));
  return !!rd && rd.created_by === S.user.id && isToday(rd.created_at);
}

/* ---------- Offline queue ---------- */
const queue = () => store.get(qKey()) || [];
const setQueue = q => store.set(qKey(), q);
function applyLocal(bid, round, cats, extra){
  let rd = readingAt(bid, round);
  const now = new Date().toISOString();
  const done = (() => { try{ return checkCats(cats); }catch(e){ return false; } })();
  if(rd) Object.assign(rd, {cats:clone(cats), complete:done, updated_at:now, ...extra});
  else { rd = {id:'local-'+Date.now(), branch_id:bid, round, sup_id:branchById(bid).sup_id, cats:clone(cats), complete:done, created_at:now, updated_at:now, created_by:S.user.id, updated_by:S.user.id, ...extra}; S.data.readings.push(rd); }
  cacheData();
}
function mergeServerReading(rd){
  S.data.readings = S.data.readings.filter(x => !(x.branch_id === rd.branch_id && x.round === rd.round));
  S.data.readings.push(rd);
}
function cacheData(){ if(S.user) store.set('data:' + S.user.id, S.data); }
async function pushOne(item){
  const cats = clone(item.cats), refs = {};
  for(const k of CAT_KEYS){
    const v = cats[k];
    if(v && v.photoData){
      const r = await API.savePhoto(S.sess.id, S.sess.pin, item.branch, k, v.photoData, item.round);
      (S.photos[item.branch] = S.photos[item.branch] || {})[k] = {data:v.photoData, round:item.round, updated_at:new Date().toISOString()};
      (S.photoIdx[item.branch] = S.photoIdx[item.branch] || {})[k] = {round:item.round};
      v.photo = refs[k] = r.ref; delete v.photoData;
    }
  }
  const res = await API.saveReading(S.sess.id, S.sess.pin, item.branch, cats, item.round);
  mergeServerReading(res.reading);
  if(res.round != null) S.data.round = res.round;
  cacheData();
  return {res, refs};
}
async function syncQueue(){
  if(!S.user) return;
  let q = queue(); if(!q.length) return;
  while(q.length){
    try{ await pushOne(q[0]); q.shift(); setQueue(q); }
    catch(e){ if(e.code === 'network') break; toast(t('uploadFail') + e.message, 5000); q.shift(); setQueue(q); }
  }
  if(!queue().length) toast(t('uploadedAll'));
  safeRender();
}
// re-render unless someone is typing in a category box (a re-render would drop their keyboard)
function safeRender(){ const a = document.activeElement; if(a && a.closest && a.closest('.stage')) paintAsv(); else render(); }

/* ---------- Draft ---------- */
function openBranch(bid, round){
  if(S.draft && (S.draft.branch !== bid || S.draft.round !== (round ?? S.draft.round))) flushAutosave();
  const b = branchById(bid);
  const R = round ?? roundFor(b.sup_id);
  S.sel = bid; S.editRound = R; S.armed = null; S.waLink = null; S.asv = {state:'idle'};
  const d = allDrafts()[draftId(bid, R)];
  if(d) S.draft = d;
  else { const rd = readingAt(bid, R); S.draft = {branch:bid, round:R, cats: rd ? clone(rd.cats) : {}, open:null}; }
  if(isMgr()) S.draft.editing = S.draft.editing || false;
  store.set(oKey(), {b:bid, r:R});
  render(); scrollTo('editor'); loadPhotos(bid);
}
function scrollTo(id){ setTimeout(() => { const el = document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }, 40); }
function saveDraft(d){
  d = d || S.draft;
  if(!d || !S.user) return;
  const all = allDrafts();
  if(draftDirty(d) || d.open) all[draftId(d.branch, d.round)] = d;
  else delete all[draftId(d.branch, d.round)];
  store.set(dKey(), all);
}
function closeBranch(){
  flushAutosave();
  S.sel = null; S.draft = null; S.editRound = null; S.waLink = null; store.del(oKey()); render();
}
function draftDirty(d){
  d = d || S.draft; if(!d) return false;
  const rd = readingAt(d.branch, d.round);
  return JSON.stringify(d.cats) !== JSON.stringify(rd ? rd.cats : {});
}

/* ---------- Auto-save: nothing typed is lost even if Save is never tapped ---------- */
let asvTimer = null;
function scheduleAutosave(ms = 2500){ clearTimeout(asvTimer); asvTimer = setTimeout(() => autoSave(), ms); }
function flushAutosave(){ clearTimeout(asvTimer); if(S.draft && draftDirty()) autoSave(); }
async function autoSave(){
  if(!S.draft || !draftDirty()) return;
  const b = branchById(S.draft.branch); if(!b || !editable(b, S.draft.round)) return;
  try{ checkCats(S.draft.cats); }catch(e){ return; }
  if(S.saving){ scheduleAutosave(1500); return; }
  await saveCore(true);
  const a = document.activeElement;
  if(a && a.closest && a.closest('.stage')) paintAsv(); else render();
}
function paintAsv(){ const el = document.getElementById('asv'); if(el) el.outerHTML = asvHtml(); }
function asvHtml(){
  const a = S.asv || {state:'idle'};
  const txt = a.state === 'saving' ? t('asvSaving') : a.state === 'saved' ? t('asvSaved',{t:a.time}) : a.state === 'local' ? t('asvLocal') : a.state === 'error' ? t('asvErr',{e:esc(a.msg)}) : t('asvIdle');
  return `<div class="asv ${a.state==='saved'?'ok':a.state==='error'?'err':''}" id="asv">${txt}</div>`;
}
// saves the open draft (photos first, then the reading); offline goes to the queue
async function saveCore(silent){
  const d = S.draft;
  if(!d || !Object.keys(d.cats).length) return false;
  const item = {branch:d.branch, round:d.round, cats:clone(d.cats)};
  S.saving = true; S.asv = {state:'saving'}; paintAsv();
  const applyRefs = refs => { for(const [k, ref] of Object.entries(refs)){
      const c = d.cats[k]; if(c && c.photoData === item.cats[k].photoData){ c.photo = ref; delete c.photoData; }
      if(d.open && d.open.k === k && d.open.photoData === item.cats[k].photoData){ d.open.photo = ref; delete d.open.photoData; } } };
  try{
    const {refs} = await pushOne(item);
    applyRefs(refs);
    saveDraft(d);
    S.asv = {state:'saved', time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Cairo'})};
    return true;
  }catch(e){
    if(e.code === 'network'){
      const q = queue().filter(x => !(x.branch === item.branch && x.round === item.round)); q.push(item); setQueue(q);
      applyLocal(item.branch, item.round, item.cats, {pending:true});
      saveDraft(d); S.asv = {state:'local'};
      return true;
    }
    S.asv = {state:'error', msg:e.message}; if(!silent) toast(e.message, 4000);
    return false;
  }finally{ S.saving = false; paintAsv(); }
}
// copy the open category's numbers into the draft as soon as they are valid
function commitOpen(){
  const o = S.draft && S.draft.open; if(!o) return;
  const keep = {}; if(o.photo) keep.photo = o.photo; if(o.photoData) keep.photoData = o.photoData;
  if(o.na){ S.draft.cats[o.k] = {na:true, ...keep}; return; }
  const tt = num(o.t), a = num(o.a);
  if(tt != null && a != null && tt > 0 && a >= 0 && a <= tt) S.draft.cats[o.k] = {t:tt, a, ...keep};
  else if(S.draft.cats[o.k] && !S.draft.cats[o.k].na) Object.assign(S.draft.cats[o.k], keep);
}
// upload drafts left on this phone for other branches (e.g. the app was closed before saving)
async function syncDrafts(){
  const all = allDrafts();
  for(const [id, d] of Object.entries(all)){
    if(S.draft && draftId(S.draft.branch, S.draft.round) === id) continue;
    const b = branchById(d.branch);
    if(!b || !draftDirty(d)){ if(!d.open || !b) dropDraft(d.branch, d.round); continue; }
    if(!editable(b, d.round)) continue;
    try{ checkCats(d.cats); }catch(e){ continue; }
    try{ await pushOne({branch:d.branch, round:d.round, cats:clone(d.cats)}); dropDraft(d.branch, d.round); }
    catch(e){ if(e.code === 'network') break; }
  }
}
async function loadPhotos(bid, force){
  if(!force && S.photos[bid]) return;
  try{ S.photos[bid] = await API.getPhotos(S.sess.id, S.sess.pin, bid) || {}; }
  catch(e){ S.photos[bid] = S.photos[bid] || {}; return; }
  const a = document.activeElement;
  if(S.sel === bid && !(a && a.closest && a.closest('.stage'))) render();
}
function photoSrc(bid, k, c){
  if(c && c.photoData) return c.photoData;
  if(c && c.photo && !String(c.photo).startsWith('db:')) return API.photoUrl(c.photo);
  const p = S.photos[bid] && S.photos[bid][k];
  return p ? p.data : null;
}
function photoStrip(bid){
  const ph = S.photos[bid];
  if(!ph) return `<div class="muted">${t('loadingPhotos')}</div>`;
  if(!Object.keys(ph).length) return `<div class="muted">${t('noPhotos')}</div>`;
  return `<div class="strip">${CAT_KEYS.map(k => { const p = ph[k], cap = catName(k);
    return `<div class="tile"><b>${cap}</b>${p ? `<img src="${esc(p.data)}" alt="${esc(cap)}" data-act="viewphoto" data-src="${esc(p.data)}" data-cap="${esc(cap + ' · ' + t('photoOf',{r:p.round ?? '—', d:fmtDate(p.updated_at)}))}">
      <small>${t('photoOf',{r:p.round ?? '—', d:fmtDate(p.updated_at)})}</small>` : `<div class="ph">${t('noPhoto')}</div>`}</div>`; }).join('')}</div>`;
}
/* ===================== Sign in ===================== */
async function boot(){
  applyLang();
  if(S.sess){
    const cached = store.get('data:' + S.sess.id);
    if(cached){ S.data = cached; S.user = cached.user; restoreDraft(); render(); }
    try{ await loadData(); }
    catch(e){
      if(e.code === 'bad_pin' || e.code === 'locked'){ logout(); toast(e.message); return; }
      if(!S.data){ S.login.err = e.message; renderLogin(); return; }
      toast(t('offlineCache'));
    }
    syncQueue().then(syncDrafts).then(safeRender).catch(() => {}); return;
  }
  renderLogin();
  try{ S.users = await API.listUsers(); store.set('users-cache', S.users); renderLogin(); }
  catch(e){ if(!S.users.length){ S.login.err = e.message; renderLogin(); } }
}
async function loadData(){
  const d = await API.getData(S.sess.id, S.sess.pin);
  const pend = S.data ? S.data.readings.filter(r => r.pending) : [];
  S.data = d; S.user = d.user; if(!S.data.targets) S.data.targets = {};
  pend.forEach(p => { S.data.readings = S.data.readings.filter(x => !(x.branch_id === p.branch_id && x.round === p.round)); S.data.readings.push(p); });
  cacheData(); restoreDraft(); render();
  API.photoIndex(S.sess.id, S.sess.pin).then(x => { S.photoIdx = x || {}; }).catch(() => {});
}
function restoreDraft(){
  if(S.sel || !S.user) return;
  const o = store.get(oKey()); if(!o) return;
  const b = branchById(o.b); if(!b) { store.del(oKey()); return; }
  if(S.user.role === 'sup' && o.r !== roundFor(b.sup_id) && !editable(b, o.r)){ dropDraft(o.b, o.r); store.del(oKey()); return; }
  const d = allDrafts()[draftId(o.b, o.r)];
  const rd = readingAt(o.b, o.r);
  S.draft = d || {branch:o.b, round:o.r, cats: rd ? clone(rd.cats) : {}, open:null};
  S.sel = o.b; S.editRound = o.r;
  setTimeout(() => { loadPhotos(o.b); if(draftDirty()) scheduleAutosave(1500); }, 0);
}
function logout(){
  saveDraft();
  if(S.user) store.del('data:' + S.user.id);
  store.del('sess'); S.sess = null; S.user = null; S.data = null; S.sel = null; S.draft = null; S.edits = {};
  S.login = {gov:'', uid:'', pin:'', err:''};
  boot();
}
async function doLogin(){
  const {uid, pin} = S.login;
  if(!uid){ S.login.err = t('needName'); return renderLogin(); }
  if(!pin){ S.login.err = t('needPin'); return renderLogin(); }
  S.busy = true; renderLogin();
  try{ await API.login(uid, pin); S.sess = {id:uid, pin}; store.set('sess', S.sess); await loadData(); syncQueue().then(syncDrafts).then(safeRender).catch(() => {}); }
  catch(e){ S.login.err = e.message; S.busy = false; renderLogin(); }
  S.busy = false;
}
const langBtn = () => `<button class="btn sm lang" data-act="lang" lang="${LANG==='en'?'ar':'en'}">${t('langBtn')}</button>`;

function renderLogin(){
  const app = document.getElementById('app'); app.className = 'wrap';
  const L = S.login, groups = [...GOV_KEYS, 'mgmt'];
  const inGroup = g => S.users.filter(u => g === 'mgmt' ? !u.gov : u.gov === g);
  app.innerHTML = `
    <div class="topbar"><div class="brand">${t('appTitle')}<small>${t('appSub')}</small></div><div class="who">${langBtn()}</div></div>
    ${DEMO ? `<div class="banner">${t('demo')}</div>` : ''}
    <div class="card">
      <h2>${t('login')}</h2>
      <div class="field"><label class="lbl" for="lgGov">${t('gov')}</label>
        <select id="lgGov" data-in="lgGov"><option value="">${t('chooseGov')}</option>
          ${groups.map(g => `<option value="${g}" ${L.gov===g?'selected':''}>${g==='mgmt'?t('mgmt'):govName(g)}</option>`).join('')}
        </select></div>
      <div class="field"><label class="lbl" for="lgUser">${t('user')}</label>
        <select id="lgUser" data-in="lgUser" ${L.gov?'':'disabled'}><option value="">${t('chooseName')}</option>
          ${L.gov ? inGroup(L.gov).map(u => `<option value="${u.id}" ${L.uid===u.id?'selected':''}>${esc(u.name)} — ${esc(jobTitle(u))}</option>`).join('') : ''}
        </select></div>
      <div class="field"><label class="lbl" for="lgPin">${t('pin')}</label>
        <input id="lgPin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" data-in="lgPin" value="${esc(L.pin)}"></div>
      ${L.err ? `<div class="err">${esc(L.err)}</div>` : ''}
      <button class="btn primary" data-act="login" ${S.busy?'disabled':''}>${S.busy?t('signingIn'):t('signIn')}</button>
    </div>`;
}

/* ===================== Main screen ===================== */
function render(){
  applyLang();
  if(!S.user || !S.data) return renderLogin();
  const app = document.getElementById('app');
  app.className = isMgr() ? 'wrap wide' : 'wrap';
  const q = queue().length;
  const me = findUser(S.user.id) || S.user;
  app.innerHTML = `
    <div class="topbar">
      <div class="brand">${t('appTitle')}<small>${esc(S.user.name)} · ${esc(jobTitle(me))}${S.user.gov ? ' · ' + govName(S.user.gov) : ''}</small></div>
      <div class="who">
        ${q ? `<button class="btn sm" data-act="sync">${t('pendingN',{n:q})}</button>` : ''}
        ${langBtn()}
        <button class="btn sm ghost" data-act="refresh">${t('refresh')}</button>
        <button class="btn sm ghost" data-act="logout">${t('logout')}</button>
      </div>
    </div>
    ${DEMO ? `<div class="banner">${t('demoShort')}</div>` : ''}
    ${!S.online ? `<div class="banner">${t('offline')}</div>` : ''}
    ${isMgr() ? renderManager() : renderSup()}`;
}

/* ---------- Branch picker (dropdown) ---------- */
function statChips(total, done){
  const f = S.filter;
  return `<div class="grid3">
    <button class="stat ${f==='all'?'on':''}" data-act="filter" data-v="all"><b>${total}</b><span>${t('total')}</span></button>
    <button class="stat ${f==='done'?'on':''}" data-act="filter" data-v="done"><b>${done}</b><span>${t('done')}</span></button>
    <button class="stat ${f==='left'?'on':''}" data-act="filter" data-v="left"><b>${total-done}</b><span>${t('left')}</span></button>
  </div>`;
}
function branchSelect(st){
  const f = S.filter;
  const left = st.filter(x => x.s !== 'done'), done = st.filter(x => x.s === 'done');
  const mark = {none:'', partial:' · ' + t('st_partial'), pend:' · ' + t('st_pend'), done:' ✓'};
  const extra = b => isMgr() && S.f.sup === 'all' ? ' — ' + userName(b.sup_id) : '';
  const opt = ({b,s}) => `<option value="${b.id}" ${S.sel===b.id?'selected':''}>${esc(b.name)}${esc(extra(b))}${mark[s]}${hasDraft(b.id) ? t('draftMark') : ''}${S.photoIdx[b.id] ? ' 📷' : ''}</option>`;
  const groups = [];
  if(f !== 'done') groups.push(`<optgroup label="${t('grpLeft',{n:left.length})}">${left.map(opt).join('')}</optgroup>`);
  if(f !== 'left') groups.push(`<optgroup label="${t('grpDone',{n:done.length})}">${done.map(opt).join('')}</optgroup>`);
  const empty = f === 'left' && !left.length;
  return `<div class="field"><label class="lbl" for="bsel">${t('chooseBranch')}</label>
    <select id="bsel" data-in="bsel" ${empty?'disabled':''}><option value="">${empty ? t('allDone') : t('chooseBranch') + '…'}</option>${groups.join('')}</select></div>`;
}

/* ---------- Branch supervisor ---------- */
function renderSup(){
  const R = roundFor(S.user.id);
  const st = S.data.branches.filter(b => b.active).map(b => ({b, s: branchStatus(b)}));
  const done = st.filter(x => x.s === 'done').length;
  return `
    <div class="card">
      <div class="row between"><h2>${t('yourBranches')}</h2><span class="round-tag">${t('readingN',{n:R})}</span></div>
      ${statChips(st.length, done)}
      ${branchSelect(st)}
      <button class="btn sm" data-act="excel">${t('exportCur')}</button>
    </div>
    ${S.sel ? renderEditor() : ''}`;
}

/* ---------- Reading editor ---------- */
function renderEditor(){
  const b = branchById(S.sel); if(!b || !S.draft) return '';
  const d = S.draft, R = d.round, rd = readingAt(b.id, R), can = editable(b, R), sup = S.user.role === 'sup';
  const prevToday = sup ? S.data.readings.find(x => x.branch_id === b.id && x.round !== R && x.created_by === S.user.id && isToday(x.created_at)) : null;
  const cats = d.cats;
  const head = `<div class="row between">
      <div><h2>${esc(b.name)}</h2><div class="muted">${govName(b.gov)} · ${esc(userName(b.sup_id))}</div></div>
      <span class="round-tag">${t('readingN',{n:R})}</span></div>`;
  const wa = S.waLink ? `<a href="${esc(S.waLink)}" target="_blank" rel="noopener">${t('waFallback')}</a>` : '';
  if(!can && !rd) return `<div class="card" id="editor">${head}<div class="banner info">${t('locked')}</div><button class="btn" data-act="close">${t('back')}</button></div>`;
  if(!can) return `<div class="card" id="editor">${head}
      <div class="banner info">${t('lockedNote',{d:fmtDate(rd.created_at)})}</div>
      ${summaryTable(rd.cats, b.id, R)}
      <div class="grid2"><button class="btn wa" data-act="share">${t('share')}</button><button class="btn" data-act="close">${t('back')}</button></div>${wa}</div>`;
  const o = d.open, n = Object.keys(cats).length;
  return `<div class="card" id="editor">${head}
    ${prevToday ? `<button class="btn sm" data-act="editprev" data-r="${prevToday.round}">${t('editToday',{n:prevToday.round})}</button>` : ''}
    ${rd && rd.complete && sup ? `<div class="banner info">${t('editTodayNote')}</div>` : ''}
    ${rd && canEdit() ? `<div class="muted">${t('lastEdit',{d:fmtDate(rd.updated_at), u:esc(userName(rd.updated_by))})}</div>` : ''}
    <div><span class="lbl">${t('categories')}</span>
    <div class="cats">
      ${CAT_KEYS.map(k => { const c = cats[k], g = c && !c.na ? catGap(k, c) : null;
        const stt = !c ? t('notRec') : c.na ? t('na') : `${fmtN(c.t)} / ${fmtN(c.a)} · ${fmtP(catPct(c))}`;

async function compress(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 900, s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.55);
  } finally { URL.revokeObjectURL(url); }
}

// Edits are kept in S.edits until "Save all changes", so re-renders (search, filters) never lose them.
function origOf(row){
  const [kind, id] = row.split(':');
  if(kind === 'u'){ const u = S.data.users.find(x => x.id === id) || {}; return {name:u.name||'', title:u.title||'', role:u.role||'sup', gov:u.gov||'', active:u.active !== false, pin:''}; }
  if(kind === 'b'){ const b = branchById(+id) || {}; return {name:b.name||'', gov:b.gov||'', sup_id:b.sup_id||'', active:!!b.active}; }
  const tg = targets(), o = {}; CAT_KEYS.forEach(k => o[k] = tg[k] != null ? String(+(tg[k]*100).toFixed(2)) : ''); return o;
}
const edVal = (row, f) => { const e = S.edits[row]; return e && f in e ? e[f] : origOf(row)[f]; };
const editCount = () => Object.values(S.edits).reduce((n, e) => n + Object.keys(e).length, 0);
function setEdit(row, f, v){
  const o = origOf(row)[f];
  const same = typeof o === 'boolean' ? o === v : String(o ?? '') === String(v ?? '');
  if(same){ if(S.edits[row]){ delete S.edits[row][f]; if(!Object.keys(S.edits[row]).length) delete S.edits[row]; } }
  else (S.edits[row] = S.edits[row] || {})[f] = v;

async function saveAllEdits(){
  const rows = Object.keys(S.edits);
  // validate everything first, so nothing is half-saved because of a typo
  const jobs = [];
  for(const row of rows){
    const [kind, id] = row.split(':'), v = {...origOf(row), ...S.edits[row]};
    if(kind === 'u'){
      if(!String(v.name).trim()) throw new Error(t('needNameT'));
      if(v.role !== 'admin' && v.role !== 'analyst' && !v.gov) throw new Error(t('needGov') + ': ' + v.name);
      const pin = String(v.pin || '').trim();
      if(pin && !/^[0-9]{4,8}$/.test(pin)) throw mkErr('bad_new_pin');
      jobs.push({row, n:Object.keys(S.edits[row]).length, run: () => API.saveUser(S.sess.id, S.sess.pin, {id, name:v.name, title:String(v.title).trim(), role:v.role, gov:v.gov || null, active:v.active, pin: pin || null}), pin, id});
    } else if(kind === 'b'){
      if(!String(v.name).trim()) throw new Error(t('needBranchName'));
      jobs.push({row, n:Object.keys(S.edits[row]).length, run: () => API.saveBranch(S.sess.id, S.sess.pin, {id:+id, name:v.name, gov:v.gov, sup_id:v.sup_id, active:v.active})});
    } else {
      const tg = {};
      for(const k of CAT_KEYS){ const x = num(v[k]); if(x != null){ if(x < 0 || x > 100) throw mkErr('invalid'); tg[k] = Math.round(x*100)/10000; } }
      jobs.push({row, n:Object.keys(S.edits[row]).length, run: () => API.saveTargets(S.sess.id, S.sess.pin, tg)});
    }
  }
  let saved = 0;
  try{
    for(const j of jobs){
      await j.run();
      if(j.pin && j.id === S.sess.id){ S.sess.pin = j.pin; store.set('sess', S.sess); }
      saved += j.n; delete S.edits[j.row];
    }
  } finally {
    await loadData().catch(() => {});
  }
  return saved;
}

async function saveFile(name, blob){
  try{
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if(dl){ await dl.save({filename:name, data:blob}); return; }
  }catch(e){ if(e && e.code === 'declined') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;

}

  if(k === 'lgPin'){ S.login.pin = el.value; return; }
  if(k === 'aq'){ S.aq = el.value; const pos = el.selectionStart; render(); const n = document.getElementById('aq'); n.focus(); n.setSelectionRange(pos,pos); return; }
  if(k === 'stT' || k === 'stA'){ readStage(); commitOpen(); saveDraft(); updateStageLive(); scheduleAutosave(); return; }
});
document.addEventListener('change', async ev => {
  if(ev.target.dataset && ev.target.dataset.ed){ captureEdit(ev.target); return; }
  const el = ev.target, k = el.dataset && el.dataset.in; if(!k) return;
  if(k === 'lgGov'){ S.login.gov = el.value; S.login.uid = ''; S.login.err = ''; return renderLogin(); }
  if(k === 'lgUser'){ S.login.uid = el.value; S.login.err = ''; return; }
  if(k === 'fGov'){ flushAutosave(); S.f.gov = el.value; S.f.sup = 'all'; S.sel = null; S.draft = null; return render(); }
  if(k === 'fSup'){ flushAutosave(); S.f.sup = el.value; S.sel = null; S.draft = null; return render(); }
  if(k === 'bsel'){
    const id = +el.value; if(!id) return;
    if(isMgr()){ flushAutosave(); S.sel = id; S.draft = null; S.editRound = null; render(); scrollTo('history'); loadPhotos(id, true); return; }
    return openBranch(id);
  }
  if(k === 'stNa'){ readStage(); S.draft.open.na = el.checked; commitOpen(); saveDraft(); scheduleAutosave(); return render(); }
  if(k === 'stPhoto' && el.files && el.files[0]){
    readStage();
    try{ S.draft.open.photoData = await compress(el.files[0]); delete S.draft.open.photo; commitOpen(); saveDraft(); scheduleAutosave(); }catch(e){ toast(I18N[LANG].errs.photo); }
    return render();
  }
});
window.addEventListener('online', () => { S.online = true; render(); syncQueue(); });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden'){ saveDraft(); flushAutosave(); } });
window.addEventListener('pagehide', () => { saveDraft(); });
window.addEventListener('offline', () => { S.online = false; render(); });
setInterval(() => { if(S.user && queue().length && navigator.onLine) syncQueue(); }, 30000);

boot();
</script>
